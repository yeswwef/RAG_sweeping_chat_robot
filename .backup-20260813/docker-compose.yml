# docker-compose.yml
version: "3.9"

services:
  # ===== Agent API 服务 =====
  agent-api:
    build: .                    # 用当前目录的 Dockerfile 构建
    ports:
      - "8000:8000"            # 宿主机8000 -> 容器8000
    env_file:
      - .env                   # 自动加载 .env 文件到容器环境变量
    volumes:
      - ./rag/chroma_db:/app/rag/chroma_db  # 持久化向量数据库
      - ./agent/chroma_db:/app/agent/chroma_db  # Agent 侧向量数据库
      - ./data:/app/data                    # 持久化数据
      - ./logs:/app/logs                    # 持久化日志
    restart: unless-stopped    # 挂了自动重启
