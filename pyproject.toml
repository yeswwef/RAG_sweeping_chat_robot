[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "robot-vacuum-agent"
version = "1.0.0"
description = "扫地机器人 AI 客服 Agent"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-community>=0.4,<0.5",
    "chromadb>=1.5,<2",
    "langchain-chroma>=1.1,<2",
    "dashscope>=1.25",
    "rank-bm25==0.2.2",
    "jieba==0.42.1",
    "pypdf>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "ruff", "mypy", "pre-commit"]

# 显式声明要打包的包，避免 setuptools 自动发现报“Multiple top-level packages”
[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*", "rag*", "model*", "utils*", "config*", "data*", "logs*", "prompts*"]
