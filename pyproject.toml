[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "robot-vacuum-agent"
version = "1.0.0"
description = "扫地机器人 AI 客服 Agent"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.3.0",
    "langchain-community",
    "chromadb>=0.5.0",
    "langchain-chroma",
    "dashscope",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "ruff", "mypy", "pre-commit"]

# 显式声明要打包的包，避免 setuptools 自动发现报“Multiple top-level packages”
[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*", "rag*", "model*", "utils*", "config*", "data*", "logs*", "prompts*"]
